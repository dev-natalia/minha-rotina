services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: rotina
      POSTGRES_PASSWORD: rotina
      POSTGRES_DB: rotina
    ports:
      - "5432:5432"
    volumes:
      - dados:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro

volumes:
  dados:
