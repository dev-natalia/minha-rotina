# fly.toml app configuration file generated for minha-rotina on 2026-10-19T05:20:30-03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'minha-rotina'
primary_region = 'gru'

[deploy]
  release_command = 'alembic upgrade head'

[env]
  AMBIENTE = 'producao'
  COOKIE_SECURE = 'true'

[http_service]
  internal_port = 8080
  force_https = true
  # Sempre ligada (como no pessoal-finance): sem cold start de ~40s no primeiro acesso.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  # 256 MB: dois apps sempre ligados (este + caderno-de-gastos) cabem na franquia
  # legada do Fly (3 x shared-cpu-1x 256MB). Ver docs/operacao.md.
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
