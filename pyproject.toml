[project]
name = "minha-rotina"
version = "0.1.0"
description = "Painel pessoal: rotina semanal e contadores"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "fastapi>=0.146.0",
    "jinja2>=3.1.6",
    "psycopg[binary]>=3",
    "pydantic-settings>=2.16.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.54.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "httpx2>=2.14.0",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.4",
]
